packages:
  - configs/eslint/*
  - configs/prettier/*
  - configs/*

catalogs:
  development:
    eslint: ^10.8.1
    prettier: ^3.9.6
  production:
    eslint: ^10.3.0
    globals: ^17.4.0
    prettier: ^3.6.0
    typescript-eslint: ^8.58.0
    "@typescript-eslint/parser": ^8.58.0

minimumReleaseAge: 720

minimumReleaseAgeExclude:
  - "@changesets/cli@3.0.1"
  - "@changesets/write@1.0.1"
  - "@publint/pack@0.1.7"
  - publint@0.3.24

allowBuilds:
  lefthook: true
